[package]
name = "perl-astgen"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "perl-astgen"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
walkdir = "2"
rayon = "1"
tree-sitter = "0.26"
ts-parser-perl = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
chrono = { version = "0.4", features = ["clock"] }

[dev-dependencies]
tempfile = "3"
