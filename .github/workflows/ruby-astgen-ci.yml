name: Ruby AST Generator CI

on:
  workflow_call:  # Called by monorepo-ci.yml
  workflow_dispatch:  # Manual runs for testing

defaults:
  run:
    working-directory: ruby-astgen

jobs:
  ruby-ci:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.1.4
          bundler-cache: true
          working-directory: ruby-astgen

      - name: Run the default task
        run: bundle exec rake

  jruby-ci:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up MSYS2 (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          release: false
          msystem: MINGW64
          install: make mingw-w64-x86_64-gcc

      - name: Add MSYS2 to PATH (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          echo "${RUNNER_TEMP}/msys64/mingw64/bin" >> "$GITHUB_PATH"
          echo "${RUNNER_TEMP}/msys64/usr/bin" >> "$GITHUB_PATH"

      - name: Set up JRuby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: jruby-9.4.8.0
          bundler-cache: false
          working-directory: ruby-astgen

      - name: Set up JRuby environment
        shell: bash
        working-directory: ruby-astgen
        run: |
          mkdir -p ${PWD}/vendor/bundle/jruby/3.1.0
          echo "GEM_HOME=${PWD}/vendor/bundle/jruby/3.1.0" >> "$GITHUB_ENV"
          echo "GEM_PATH=${PWD}/vendor/bundle/jruby/3.1.0" >> "$GITHUB_ENV"
          echo "${PWD}/vendor/bundle/jruby/3.1.0/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        shell: bash
        working-directory: ruby-astgen
        run: |
          gem install bundler -v 2.5.21 --install-dir ${GEM_HOME}
          bundle install

      - name: Diagnose prism (Windows)
        if: runner.os == 'Windows'
        shell: bash
        working-directory: ruby-astgen
        run: |
          LIBDIR="$(bundle exec ruby -e 'print RbConfig::CONFIG["libdir"]')"
          echo "=== JRuby libdir prism dll ==="
          ls -la "$LIBDIR/prism" || echo "no libdir prism"
          echo "=== vendored build dll ==="
          ls -la vendor/bundle/jruby/3.1.0/gems/prism-*/build/ || echo "no vendored build"
          echo "=== symbols in the JRuby-libdir dll (the one being loaded) ==="
          nm -D "$LIBDIR/prism/libprism.dll" 2>/dev/null | grep -iE 'pm_serialize|pm_version|pm_parse' || echo "expected pm_* symbols NOT found"
          echo "=== symbols in the vendored dll ==="
          nm -D vendor/bundle/jruby/3.1.0/gems/prism-*/build/libprism.dll 2>/dev/null | grep -iE 'pm_serialize|pm_version|pm_parse' || echo "vendored: pm_* NOT found"
          echo "=== dependent DLLs of vendored build ==="
          objdump -p vendor/bundle/jruby/3.1.0/gems/prism-*/build/libprism.dll 2>/dev/null | grep -i 'DLL Name' || true

      - name: Run tests with JRuby
        shell: bash
        working-directory: ruby-astgen
        run: bundle exec rake
