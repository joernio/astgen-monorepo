name: Ruby AST Generator CI

on:
  workflow_call:  # Called by monorepo-ci.yml
  workflow_dispatch:  # Manual runs for testing

defaults:
  run:
    working-directory: ruby-astgen

jobs:
  ruby-ci:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: 3.1.4
          bundler-cache: true
          working-directory: ruby-astgen

      - name: Run the default task
        run: bundle exec rake

  jruby-ci:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up JRuby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: jruby-9.4.15.0
          bundler-cache: true
          working-directory: ruby-astgen

      - name: Set up JRuby environment
        shell: bash
        working-directory: ruby-astgen
        run: |
          RUBY_ABI=$(ruby -e 'print Gem.ruby_api_version')
          BUNDLE_BASE="${PWD}/vendor/bundle/jruby/${RUBY_ABI}"
          mkdir -p "${BUNDLE_BASE}"
          
          echo "GEM_HOME=${BUNDLE_BASE}" >> "$GITHUB_ENV"
          echo "GEM_PATH=${BUNDLE_BASE}:${GEM_PATH}" >> "$GITHUB_ENV"
          echo "${BUNDLE_BASE}/bin" >> "$GITHUB_PATH"

      - name: Build prism native library (Windows)
        if: runner.os == 'Windows'
        shell: bash
        working-directory: ruby-astgen
        run: |
          RUBY_ABI=$(ruby -e 'print Gem.ruby_api_version')
          PRISM_DIR=$(ls -d vendor/bundle/jruby/${RUBY_ABI}/gems/prism-*)
          echo "Building libprism.dll in: ${PRISM_DIR}"
          make -C "${PRISM_DIR}" shared CFLAGS="-O2 -Wno-array-bounds"
          echo "Build output:"
          ls "${PRISM_DIR}/build/"

      - name: Run tests with JRuby
        shell: bash
        working-directory: ruby-astgen
        run: jruby -S bundle exec rake

  jruby-jdk-mismatch-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21 (prism extensions get built for this version)
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up JRuby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: jruby-9.4.15.0
          # Deliberately uncached: the extensions must be built by this job, under JDK 21, for the
          # mismatch below to be genuine.
          bundler-cache: false
          working-directory: ruby-astgen

      - name: Install gems under JDK 21
        shell: bash
        working-directory: ruby-astgen
        run: |
          jruby -S bundle config set --local path vendor/bundle
          jruby -S bundle install --jobs 4

      - name: Switch to JDK 25 without reinstalling gems
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Show JRuby environment
        shell: bash
        working-directory: ruby-astgen
        run: |
          java -version
          jruby -e 'puts RUBY_DESCRIPTION; puts "gem platforms: #{Gem.platforms.map(&:to_s).inspect}"'
          ls vendor/bundle/jruby/*/extensions

      # Deliberately not `bundle exec`: when prism's extensions do not match the running platform,
      # `Bundler.setup` aborts the process before any of our code runs. Plain RubyGems ignores the
      # gem instead, which is how a released gem behaves.
      # EXPECT_PRISM=true fails the job if prism did not load.
      - name: Verify prism loads despite mismatched JDK
        shell: bash
        working-directory: ruby-astgen
        env:
          EXPECT_PRISM: "true"
        run: |
          RUBY_ABI=$(jruby -e 'print Gem.ruby_api_version')
          export GEM_HOME="${PWD}/vendor/bundle/jruby/${RUBY_ABI}"
          export GEM_PATH="${GEM_HOME}"
          jruby -Ilib spec/integration/prism_fallback_smoke.rb
