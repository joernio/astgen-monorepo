name: Ruby AST Generator CI

on:
  workflow_call:  # Called by monorepo-ci.yml
  workflow_dispatch:  # Manual runs for testing

defaults:
  run:
    working-directory: ruby-astgen

jobs:
  ruby-ci:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.1.4
          bundler-cache: true
          working-directory: ruby-astgen

      - name: Run the default task
        run: bundle exec rake

  jruby-ci:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up JRuby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: jruby-10.0.6.0
          bundler-cache: false
          working-directory: ruby-astgen

      - name: Set up JRuby environment
        shell: bash
        working-directory: ruby-astgen
        run: |
          RUBY_ABI=$(ruby -e 'print Gem.ruby_api_version')
          BUNDLE_BASE="${PWD}/vendor/bundle/jruby/${RUBY_ABI}"
          mkdir -p "${BUNDLE_BASE}"
          echo "GEM_HOME=${BUNDLE_BASE}" >> "$GITHUB_ENV"
          echo "GEM_PATH=${BUNDLE_BASE}" >> "$GITHUB_ENV"
          echo "${BUNDLE_BASE}/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        shell: bash
        working-directory: ruby-astgen
        env:
          JAVA_OPTS: "-Xrs"
        run: |
          jruby -S gem install bundler --install-dir ${GEM_HOME}
          jruby -S bundle install

      - name: Run tests with JRuby
        shell: bash
        working-directory: ruby-astgen
        run: jruby -S bundle exec rake
