name: Ruby AST Generator CI

on:
  workflow_call:  # Called by monorepo-ci.yml
  workflow_dispatch:  # Manual runs for testing

defaults:
  run:
    working-directory: ruby-astgen

jobs:
  ruby-ci:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: 3.1.4
          bundler-cache: true
          working-directory: ruby-astgen

      - name: Run the default task
        run: bundle exec rake

  jruby-ci:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up JRuby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: jruby-10.0.6.0
          bundler-cache: true
          working-directory: ruby-astgen

      - name: Set up JRuby environment
        shell: bash
        working-directory: ruby-astgen
        run: |
          RUBY_ABI=$(ruby -e 'print Gem.ruby_api_version')
          BUNDLE_BASE="${PWD}/vendor/bundle/jruby/${RUBY_ABI}"
          mkdir -p "${BUNDLE_BASE}"
          
          echo "GEM_HOME=${BUNDLE_BASE}" >> "$GITHUB_ENV"
          echo "GEM_PATH=${BUNDLE_BASE}:${GEM_PATH}" >> "$GITHUB_ENV"
          echo "${BUNDLE_BASE}/bin" >> "$GITHUB_PATH"

      - name: Build prism native library (Windows)
        if: runner.os == 'Windows'
        shell: bash
        working-directory: ruby-astgen
        run: |
          RUBY_ABI=$(ruby -e 'print Gem.ruby_api_version')
          PRISM_DIR=$(ls -d vendor/bundle/jruby/${RUBY_ABI}/gems/prism-*)
          echo "Building libprism.dll in: ${PRISM_DIR}"
          make -C "${PRISM_DIR}" shared CFLAGS="-O2 -Wno-array-bounds"
          echo "Build output:"
          ls "${PRISM_DIR}/build/"

      - name: Run tests with JRuby
        shell: bash
        working-directory: ruby-astgen
        run: jruby -S bundle exec rake
