name: Ruby AST Generator CI

on:
  workflow_call:  # Called by monorepo-ci.yml
  workflow_dispatch:  # Manual runs for testing

defaults:
  run:
    working-directory: ruby-astgen

jobs:
  ruby-ci:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.1.4
          bundler-cache: true
          working-directory: ruby-astgen

      - name: Run the default task
        run: bundle exec rake

  jruby-ci:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.1.4
          bundler-cache: false
          working-directory: ruby-astgen

      - name: Set up MSYS2 (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          release: false
          msystem: UCRT64
          install: make mingw-w64-ucrt-x86_64-gcc

      - name: Add MSYS2 to PATH (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          echo "${RUNNER_TEMP}/msys64/ucrt64/bin" >> "$GITHUB_PATH"
          echo "${RUNNER_TEMP}/msys64/usr/bin" >> "$GITHUB_PATH"

      - name: Set up JRuby
        shell: bash
        working-directory: ruby-astgen
        run: |
          curl -L 'https://repo1.maven.org/maven2/org/jruby/jruby-complete/9.4.8.0/jruby-complete-9.4.8.0.jar' \
            --output jruby.jar

      - name: Install dependencies
        run: |
          mkdir -p ${PWD}/vendor/bundle/jruby/3.1.0
          export GEM_HOME=${PWD}/vendor/bundle/jruby/3.1.0
          export GEM_PATH=${PWD}/vendor/bundle/jruby/3.1.0
          export PATH=$GEM_HOME/bin:$PATH
          java -jar jruby.jar -S gem install bundler -v 2.5.21 --install-dir ${GEM_HOME}
          java -jar jruby.jar -S bundle install

      - name: Run tests with JRuby
        run: |
          export GEM_HOME=${PWD}/vendor/bundle/jruby/3.1.0
          export GEM_PATH=${PWD}/vendor/bundle/jruby/3.1.0
          export PATH=$GEM_HOME/bin:$PATH
          java -jar jruby.jar -S bundle exec rake
