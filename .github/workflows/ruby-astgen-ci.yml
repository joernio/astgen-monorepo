name: Ruby AST Generator CI

on:
  workflow_call:  # Called by monorepo-ci.yml
  workflow_dispatch:  # Manual runs for testing

defaults:
  run:
    working-directory: ruby-astgen

jobs:
  ruby-ci:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.1.4
          bundler-cache: true
          working-directory: ruby-astgen

      - name: Run the default task
        run: bundle exec rake

  jruby-ci:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Add MSYS2 to PATH (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          echo "${RUNNER_TEMP}/msys64/mingw64/bin" >> "$GITHUB_PATH"
          echo "${RUNNER_TEMP}/msys64/usr/bin" >> "$GITHUB_PATH"

      - name: Set up JRuby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: jruby-10.0.6.0
          bundler-cache: false
          working-directory: ruby-astgen

      - name: Set up JRuby environment
        shell: bash
        working-directory: ruby-astgen
        run: |
          RUBY_ABI=$(ruby -e 'print Gem.ruby_api_version')
          BUNDLE_BASE="${PWD}/vendor/bundle/jruby/${RUBY_ABI}"
          mkdir -p "${BUNDLE_BASE}"
          echo "GEM_HOME=${BUNDLE_BASE}" >> "$GITHUB_ENV"
          echo "GEM_PATH=${BUNDLE_BASE}" >> "$GITHUB_ENV"
          echo "${BUNDLE_BASE}/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        shell: bash
        working-directory: ruby-astgen
        env:
          JAVA_OPTS: "-Xrs"
        run: |
          jruby -S gem install bundler -v 2.5.21 --install-dir ${GEM_HOME}
          jruby -S bundle install

      - name: Inspect prism build (Windows)
        if: runner.os == 'Windows'
        shell: bash
        working-directory: ruby-astgen
        run: |
          GEM=$(ls -d vendor/bundle/jruby/3.4.0/gems/prism-*)
          echo "GEM=$GEM"
          find "$GEM" -name 'Makefile' -o -name 'Rakefile' -o -iname 'libprism*' -o -name 'extconf.rb' | sort
          echo "=== SOEXT ==="
          ruby -e 'print RbConfig::CONFIG["SOEXT"]'
          echo
          echo "=== is there a build dir at all ==="
          ls -la "$GEM/build" 2>/dev/null || echo "no build dir"
          echo "=== ext build logs ==="
          find vendor/bundle/jruby/3.4.0/extensions -iname '*prism*' 2>/dev/null || echo "no compiled extension recorded"

      - name: Run tests with JRuby
        shell: bash
        working-directory: ruby-astgen
        run: jruby -S bundle exec rake
