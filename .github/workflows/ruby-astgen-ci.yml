name: Ruby AST Generator CI

on:
  workflow_call:  # Called by monorepo-ci.yml
  workflow_dispatch:  # Manual runs for testing

defaults:
  run:
    working-directory: ruby-astgen

jobs:
  ruby-ci:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.1.4
          bundler-cache: true
          working-directory: ruby-astgen

      - name: Run the default task
        run: bundle exec rake

  jruby-ci:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up MSYS2 (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          release: false
          msystem: MINGW64
          install: make mingw-w64-x86_64-gcc

      - name: Add MSYS2 to PATH (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          echo "${RUNNER_TEMP}/msys64/mingw64/bin" >> "$GITHUB_PATH"
          echo "${RUNNER_TEMP}/msys64/usr/bin" >> "$GITHUB_PATH"

      - name: Set up JRuby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: jruby-10.0.6.0
          bundler-cache: false
          working-directory: ruby-astgen

      - name: Set up JRuby environment
        shell: bash
        working-directory: ruby-astgen
        run: |
          RUBY_ABI=$(ruby -e 'print Gem.ruby_api_version')
          BUNDLE_BASE="${PWD}/vendor/bundle/jruby/${RUBY_ABI}"
          mkdir -p "${BUNDLE_BASE}"
          echo "GEM_HOME=${BUNDLE_BASE}" >> "$GITHUB_ENV"
          echo "GEM_PATH=${BUNDLE_BASE}" >> "$GITHUB_ENV"
          echo "${BUNDLE_BASE}/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        shell: bash
        working-directory: ruby-astgen
        run: |
          gem install bundler -v 2.5.21 --install-dir ${GEM_HOME}
          bundle install

      - name: Diagnose prism (Windows)
        if: runner.os == 'Windows'
        shell: bash
        working-directory: ruby-astgen
        run: |
          DLL="D:/jruby-10.0.6.0/lib/prism/libprism.dll"
          echo "=== does the loaded DLL exist ==="
          ls -la "$DLL" || echo "MISSING"
          echo "=== what symbols does it export ==="
          nm -D "$DLL" 2>/dev/null | grep -iE 'pm_serialize_parse|pm_version|pm_buffer' || echo "no pm_* exports found"
          echo "=== what does ffi.rb:29 actually ask for ==="
          sed -n '1,40p' vendor/bundle/jruby/3.4.0/gems/prism-1.9.0/lib/prism/ffi.rb
          echo "=== dependent DLLs (unresolved deps also cause this exact error) ==="
          objdump -p "$DLL" 2>/dev/null | grep -i 'DLL Name'
          echo "=== is this DLL prism's, or JRuby's own internal one? ==="
          nm -D "$DLL" 2>/dev/null | wc -l

      - name: Fix prism native library (Windows)
        if: runner.os == 'Windows'
        shell: bash
        working-directory: ruby-astgen
        run: |
          JRUBY_PRISM_LIB="$(ruby -e 'print RbConfig::CONFIG["libdir"]')/prism"
          RUBY_ABI=$(ruby -e 'print Gem.ruby_api_version')
          cp vendor/bundle/jruby/${RUBY_ABI}/gems/prism-*/build/libprism.dll "$JRUBY_PRISM_LIB/libprism.dll"

      - name: Run tests with JRuby
        shell: bash
        working-directory: ruby-astgen
        run: bundle exec rake
