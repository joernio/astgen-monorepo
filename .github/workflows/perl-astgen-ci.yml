name: Perl AST Generator CI

on:
  workflow_call:  # Called by monorepo-ci.yml
  workflow_dispatch:  # Manual runs for testing

defaults:
  run:
    working-directory: perl-astgen

jobs:
  perl-ci-test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: perl-astgen

      - name: Check formatting
        run: cargo fmt --check

      - name: Run Clippy
        run: cargo clippy -- -D warnings

      - name: Run tests
        run: cargo test --locked

      - name: Build release binary
        shell: bash
        run: |
          cargo build --release --locked
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            cp target/release/perl-astgen.exe perl-astgen-win.exe
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            cp target/release/perl-astgen perl-astgen-macos
          else
            cp target/release/perl-astgen perl-astgen-linux
          fi

      - name: Generate PerlNodeSyntax.scala
        run: cargo run --release --locked -- --scala-ast-only

      - name: Install sbt
        uses: sbt/setup-sbt@v1

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: sbt
          cache-dependency-path: |
            perl-astgen/tests/ScalaPerlNodeSyntaxTests/build.sbt
            perl-astgen/tests/ScalaPerlNodeSyntaxTests/project/build.properties

      - name: Run Scala Tests
        run: sbt test
        working-directory: perl-astgen/tests/ScalaPerlNodeSyntaxTests
