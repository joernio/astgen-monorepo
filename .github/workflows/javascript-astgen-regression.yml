name: JavaScript AST Generator Regression

on:
  pull_request:
    paths:
      - 'javascript-astgen/**'

defaults:
  run:
    working-directory: javascript-astgen

jobs:
  regression:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Setup Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install astgen-regression
        run: |
          cd ../astgen-regression
          pip install -e .

      - name: Install PR dependencies
        run: bun install --frozen-lockfile

      - name: Build base version
        run: |
          set -e
          git fetch origin ${{ github.base_ref }}
          git worktree add ../javascript-astgen-base "origin/${{ github.base_ref }}" --no-checkout
          (cd ../javascript-astgen-base && git checkout "origin/${{ github.base_ref }}" -- javascript-astgen)
          (cd ../javascript-astgen-base/javascript-astgen && bun install --frozen-lockfile)

      - name: Run regression tests
        run: |
          BASE_SHA=$(git rev-parse --short "origin/${{ github.base_ref }}")
          PR_SHA=$(git rev-parse --short HEAD)
          astgen-regression compare \
            --config regression.yaml \
            --base-dist ../javascript-astgen-base/javascript-astgen/src \
            --pr-dist src \
            --pr-number "${{ github.event.pull_request.number }}" \
            --base-ref "${{ github.base_ref }} @ ${BASE_SHA}" \
            --pr-ref "${{ github.head_ref }} @ ${PR_SHA}" \
            --output-diffs regression-diffs \
            > regression-report.md || true

      - name: Clean up base worktree
        if: always()
        run: git worktree remove --force ../javascript-astgen-base

      - name: Upload diff artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: regression-diffs
          path: javascript-astgen/regression-diffs/
          if-no-files-found: ignore

      - name: Post PR comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            let body = fs.readFileSync('javascript-astgen/regression-report.md', 'utf8');
            const runUrl = `${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`;
            body += `\n\n---\n📎 Full diff files available as [workflow artifacts](${runUrl}).`;
            const marker = '<!-- astgen-regression -->';
            body = marker + '\n' + body;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
