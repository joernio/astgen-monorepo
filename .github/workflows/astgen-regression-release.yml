name: AST Generator Regression Framework Release

on:
  push:
    tags:
      - 'astgen-regression/v*'
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: astgen-regression

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.set-release-tag.outputs.release_tag }}
      tag_version: ${{ steps.set-tag-version.outputs.tag_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: '0'

      - name: Discover latest tag (manual run)
        if: github.event_name == 'workflow_dispatch'
        run: |
          LATEST_TAG=$(git tag --list 'astgen-regression/v*' --sort=-v:refname | head -n 1)
          echo "RELEASE_TAG=$LATEST_TAG" >> $GITHUB_ENV
          echo "Using latest tag: $LATEST_TAG"
        working-directory: .

      - name: Set tag from push event
        if: github.event_name == 'push'
        run: |
          echo "RELEASE_TAG=${{ github.ref_name }}" >> $GITHUB_ENV
        working-directory: .

      - name: Set release tag output
        id: set-release-tag
        run: echo "release_tag=${{ env.RELEASE_TAG }}" >> $GITHUB_OUTPUT

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'astgen-regression/requirements.txt'

      - name: Extract version from tag
        run: |
          TAG_VERSION=${RELEASE_TAG#astgen-regression/v}
          echo "TAG_VERSION=$TAG_VERSION" >> $GITHUB_ENV
          echo "Tag version: $TAG_VERSION"

      - name: Set tag version output
        id: set-tag-version
        run: echo "tag_version=${{ env.TAG_VERSION }}" >> $GITHUB_OUTPUT

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy pytest pytest-cov types-setuptools types-PyYAML
          pip install -e .
          pip install build

      - name: Run ruff linting
        run: |
          ruff check .

      - name: Run ruff format check
        run: |
          ruff format --check .

      - name: Run mypy type checking
        run: |
          mypy .

      - name: Run tests
        run: |
          pytest -v --cov=. --cov-report=term-missing

      - name: Build distribution package
        run: |
          python -m build

      - name: Create release archive
        run: |
          cd ..
          tar -czf astgen-regression-${{ env.TAG_VERSION }}.tar.gz \
            astgen-regression/*.py \
            astgen-regression/requirements.txt \
            astgen-regression/README.md \
            astgen-regression/pyproject.toml \
            astgen-regression/tests/

      - name: Upload release artifact
        uses: actions/upload-artifact@v8
        with:
          name: asset-astgen-regression.tar.gz
          path: astgen-regression-${{ env.TAG_VERSION }}.tar.gz
          if-no-files-found: error

  checksums:
    needs: build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v7
        with:
          path: release-artifacts
          pattern: asset-*
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd release-artifacts
          sha256sum * 2>/dev/null | grep -v "Is a directory" > SHA256SUMS || true
          sha512sum * 2>/dev/null | grep -v "Is a directory" > SHA512SUMS || true
          mkdir -p checksums
          mv SHA256SUMS SHA512SUMS checksums/

      - name: Upload checksum files
        uses: actions/upload-artifact@v8
        with:
          name: asset-checksums
          path: release-artifacts/checksums/

  release:
    needs: [build, checksums]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v7
        with:
          path: release-artifacts
          pattern: asset-*
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          tag_name: ${{ needs.build.outputs.release_tag }}
          files: release-artifacts/*
          body: |
            Release of AST Generator Regression Framework ${{ needs.build.outputs.tag_version }}

            ## Installation
            ```bash
            pip install astgen-regression-${{ needs.build.outputs.tag_version }}.tar.gz
            ```

            ## Verification
            Download checksums and verify:
            ```bash
            grep astgen-regression checksums/SHA256SUMS | sha256sum -c
            ```
