name: Ruby AST Generator Release

on:
  push:
    tags:
      - 'ruby-astgen/v*'
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: ruby-astgen

jobs:
  verify:
    runs-on: ubuntu-24.04
    outputs:
      release_tag: ${{ steps.set-release-tag.outputs.release_tag }}
      new_tag: ${{ steps.set-new-tag.outputs.new_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: '0'

      - name: Discover latest tag (manual run)
        if: github.event_name == 'workflow_dispatch'
        run: |
          LATEST_TAG=$(git tag --list 'ruby-astgen/v*' --sort=-v:refname | head -n 1)
          echo "RELEASE_TAG=$LATEST_TAG" >> $GITHUB_ENV
          echo "Using latest tag: $LATEST_TAG"
        working-directory: .

      - name: Set tag from push event
        if: github.event_name == 'push'
        run: |
          echo "RELEASE_TAG=${{ github.ref_name }}" >> $GITHUB_ENV
        working-directory: .

      - name: Set release tag output
        id: set-release-tag
        run: echo "release_tag=${{ env.RELEASE_TAG }}" >> $GITHUB_OUTPUT

      - name: Extract version from tag
        run: |
          TAG_VERSION=${RELEASE_TAG#ruby-astgen/v}
          echo "TAG_VERSION=$TAG_VERSION" >> $GITHUB_ENV
          echo "NEW_TAG=v$TAG_VERSION" >> $GITHUB_ENV
          echo "The tag version is: v$TAG_VERSION"

      - name: Verify tag matches version.rb
        run: |
          GEM_VERSION=$(grep 'VERSION = ' lib/ruby_ast_gen/version.rb | sed 's/.*VERSION = "\(.*\)"/\1/')
          echo "version.rb version: $GEM_VERSION"
          if [ "$GEM_VERSION" != "$TAG_VERSION" ]; then
            echo "Error: Tag version ($TAG_VERSION) does not match version.rb ($GEM_VERSION)"
            exit 1
          fi

      - name: Set new tag output
        id: set-new-tag
        run: echo "new_tag=${{ env.NEW_TAG }}" >> $GITHUB_OUTPUT

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            asset_name: ruby_ast_gen-linux
          - os: ubuntu-24.04-arm
            asset_name: ruby_ast_gen-linux-arm
          - os: macos-15-intel
            asset_name: ruby_ast_gen-macos
          - os: macos-15
            asset_name: ruby_ast_gen-macos-arm
          - os: windows-2025
            asset_name: ruby_ast_gen-win
          - os: windows-11-arm
            asset_name: ruby_ast_gen-win-arm
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Update version file
        shell: bash
        run: ./update_version.rb ${{ needs.verify.outputs.new_tag }}

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.1.4
          bundler-cache: false
          working-directory: ruby-astgen

      - name: Set up MSYS2 (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: make mingw-w64-ucrt-x86_64-gcc zip

      - name: Set up JRuby
        shell: bash
        run: |
          curl -L 'https://repo1.maven.org/maven2/org/jruby/jruby-complete/9.4.8.0/jruby-complete-9.4.8.0.jar' \
            --output jruby.jar

      - name: Install dependencies and build release (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p ${PWD}/vendor/bundle/jruby/3.1.0
          export GEM_HOME=${PWD}/vendor/bundle/jruby/3.1.0
          export GEM_PATH=${PWD}/vendor/bundle/jruby/3.1.0
          export PATH=$GEM_HOME/bin:$PATH

          java -jar jruby.jar -S gem install bundler -v 2.5.21 --install-dir ${GEM_HOME}
          java -jar jruby.jar -S bundle install

          find vendor/bundle/jruby/3.1.0 -mindepth 1 -maxdepth 1 -type \
            d ! -name "gems" ! -name "bin" ! -name "specifications" \
            -exec rm -rf {} +
          zip -r ${{ matrix.asset_name }}_${{ needs.verify.outputs.new_tag }}.zip \
            lib exe vendor Gemfile ruby_ast_gen.gemspec

      - name: Install dependencies and build release (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          cd ruby-astgen
          mkdir -p vendor/bundle/jruby/3.1.0
          export GEM_HOME=$(pwd)/vendor/bundle/jruby/3.1.0
          export GEM_PATH=$(pwd)/vendor/bundle/jruby/3.1.0
          export PATH=$GEM_HOME/bin:$PATH

          java -jar jruby.jar -S gem install bundler -v 2.5.21 --install-dir ${GEM_HOME}
          java -jar jruby.jar -S bundle install

          find vendor/bundle/jruby/3.1.0 -mindepth 1 -maxdepth 1 -type \
            d ! -name "gems" ! -name "bin" ! -name "specifications" \
            -exec rm -rf {} +
          zip -r ${{ matrix.asset_name }}_${{ needs.verify.outputs.new_tag }}.zip \
            lib exe vendor Gemfile ruby_ast_gen.gemspec

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: asset-${{ matrix.asset_name }}.zip
          path: ruby-astgen/${{ matrix.asset_name }}_*.zip
          if-no-files-found: error

  checksums:
    needs: [verify, build]
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: .
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v7
        with:
          path: release-artifacts
          pattern: asset-*
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd release-artifacts
          sha256sum * 2>/dev/null | grep -v "Is a directory" > SHA256SUMS || true
          sha512sum * 2>/dev/null | grep -v "Is a directory" > SHA512SUMS || true
          mkdir -p checksums
          mv SHA256SUMS SHA512SUMS checksums/

      - name: Upload checksum files
        uses: actions/upload-artifact@v7
        with:
          name: asset-checksums
          path: release-artifacts/checksums/

  release:
    needs: [verify, build, checksums]
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: .
    concurrency: ruby-astgen-release
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v7
        with:
          path: release-artifacts
          pattern: asset-*
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          tag_name: ${{ needs.verify.outputs.release_tag }}
          files: release-artifacts/*
