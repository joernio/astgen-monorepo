name: Rust AST Generator CI

on:
  workflow_call:  # Called by monorepo-ci.yml
  workflow_dispatch:  # Manual runs for testing

defaults:
  run:
    working-directory: rust-astgen

jobs:
  rust-ci:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: rust-src

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: rust-astgen

      - name: Run tests
        run: cargo test --locked --workspace

      - name: Regenerate Scala bindings
        if: matrix.os == 'ubuntu-latest'
        run: cargo run --locked -p scala_bindings_gen -- --include-date=false --output scala_tests/src/main/scala/io/joern/rust2cpg/parser/RustNodeSyntax.scala

      - name: Check if there are changes
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain --untracked-files=no)" ]]; then
            echo "::error title=Repository modified by CI::Did you forget to commit regenerated files such as rust.ungram or RustNodeSyntax.scala?"
            echo "Changes:"
            git status --short
            exit 1
          fi

      - name: Set up Java
        if: matrix.os == 'ubuntu-latest'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
          cache: sbt
          cache-dependency-path: |
            rust-astgen/scala_tests/build.sbt
            rust-astgen/scala_tests/project/build.properties

      - name: Set up sbt
        if: matrix.os == 'ubuntu-latest'
        uses: sbt/setup-sbt@ecad189dd245444b9ae0a0cd5922fd938b88906f # v1.5.12

      - name: Run Scala tests
        if: matrix.os == 'ubuntu-latest'
        working-directory: rust-astgen/scala_tests
        shell: bash
        run: sbt test

  rust-ci-format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --check
