name: JavaScript AST Generator Release

on:
  push:
    tags:
      - 'javascript-astgen/v*'
  workflow_dispatch:

defaults:
  run:
    working-directory: javascript-astgen

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.set-release-tag.outputs.release_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: '0'
      - name: Discover latest tag (manual run)
        if: github.event_name == 'workflow_dispatch'
        run: |
          LATEST_TAG=$(git tag --list 'javascript-astgen/v*' --sort=-v:refname | head -n 1)
          echo "RELEASE_TAG=$LATEST_TAG" >> $GITHUB_ENV
          echo "Using latest tag: $LATEST_TAG"
        working-directory: .
      - name: Set tag from push event
        if: github.event_name == 'push'
        run: |
          echo "RELEASE_TAG=${{ github.ref_name }}" >> $GITHUB_ENV
        working-directory: .
      - name: Set release tag output
        id: set-release-tag
        run: echo "release_tag=${{ env.RELEASE_TAG }}" >> $GITHUB_OUTPUT
        working-directory: .
      - name: Install node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'yarn'
          cache-dependency-path: 'javascript-astgen/yarn.lock'
      - name: Install ldid
        uses: MOZGIII/install-ldid-action@d5ab465f3a66a4d60a59882b935eb30e18e8d043 # v1
        with:
          tag: v2.1.5-procursus6
      - name: Build
        run: |
          yarn install
          yarn build
      - name: Test
        run: |
          yarn test
      - name: Create binaries
        run: |
          yarn binary
      - name: Rename
        run: |
          mv astgen-linux-x64 astgen-linux
          mv astgen-linux-arm64 astgen-linux-arm
          mv astgen-macos-x64 astgen-macos
          mv astgen-macos-arm64 astgen-macos-arm
          mv astgen-win-x64.exe astgen-win.exe
      - name: Run gzexe
        run: |
          gzexe astgen-linux
          rm astgen-linux~
          gzexe astgen-linux-arm
          rm astgen-linux-arm~
      - name: Print size and version
        run: |
          ls -lh ./astgen*
          ASTGEN_VERSION=$(./astgen-linux --version)
          echo "ASTGEN_VERSION=$ASTGEN_VERSION" >> $GITHUB_ENV
          echo "astgen version is: $ASTGEN_VERSION"
      - name: Upload binaries as artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: asset-astgen-win.exe
          path: javascript-astgen/astgen-win.exe
          if-no-files-found: error
      - name: Upload macOS binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: asset-astgen-macos
          path: javascript-astgen/astgen-macos
          if-no-files-found: error
      - name: Upload macOS ARM binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: asset-astgen-macos-arm
          path: javascript-astgen/astgen-macos-arm
          if-no-files-found: error
      - name: Upload Linux binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: asset-astgen-linux
          path: javascript-astgen/astgen-linux
          if-no-files-found: error
      - name: Upload Linux ARM binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: asset-astgen-linux-arm
          path: javascript-astgen/astgen-linux-arm
          if-no-files-found: error

  checksums:
    needs: build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-artifacts
          pattern: asset-*
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd release-artifacts
          sha256sum * 2>/dev/null | grep -v "Is a directory" > SHA256SUMS || true
          sha512sum * 2>/dev/null | grep -v "Is a directory" > SHA512SUMS || true
          mkdir -p checksums
          mv SHA256SUMS SHA512SUMS checksums/

      - name: Upload checksum files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: asset-checksums
          path: release-artifacts/checksums/

  release:
    needs: [build, checksums]
    runs-on: ubuntu-latest
    concurrency: javascript-astgen-release
    permissions:
      contents: write
    defaults:
      run:
        working-directory: .
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-artifacts
          pattern: asset-*
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          draft: true
          tag_name: ${{ needs.build.outputs.release_tag }}
          files: release-artifacts/*
