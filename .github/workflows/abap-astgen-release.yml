name: ABAP AST Generator Release

on:
  push:
    tags:
      - 'abap-astgen/v*'
  workflow_dispatch:

defaults:
  run:
    working-directory: abap-astgen

jobs:
  release:
    concurrency: abap-astgen-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: '0'
      - name: Discover latest tag (manual run)
        if: github.event_name == 'workflow_dispatch'
        run: |
          LATEST_TAG=$(git tag --list 'abap-astgen/v*' --sort=-v:refname | head -n 1)
          echo "RELEASE_TAG=$LATEST_TAG" >> $GITHUB_ENV
          echo "Using latest tag: $LATEST_TAG"
        working-directory: .
      - name: Set tag from push event
        if: github.event_name == 'push'
        run: |
          echo "RELEASE_TAG=${{ github.ref_name }}" >> $GITHUB_ENV
        working-directory: .
      - name: Install node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'abap-astgen/package-lock.json'
      - name: Install ldid
        uses: MOZGIII/install-ldid-action@v1
        with:
          tag: v2.1.5-procursus6
      - name: Install dependencies
        run: npm install
      - name: Create binaries
        run: npm run binary
      - name: Rename
        run: |
          mv abapgen-linux-x64 abapgen-linux
          mv abapgen-linux-arm64 abapgen-linux-arm
          mv abapgen-macos-x64 abapgen-macos
          mv abapgen-macos-arm64 abapgen-macos-arm
          mv abapgen-win-x64.exe abapgen-win.exe
      - name: Run gzexe
        run: |
          gzexe abapgen-linux
          rm abapgen-linux~
          gzexe abapgen-linux-arm
          rm abapgen-linux-arm~
      - name: Print size and version
        run: |
          ls -lh ./abapgen*
          ABAPGEN_VERSION=$(node -p "require('./package.json').version")
          echo "ABAPGEN_VERSION=$ABAPGEN_VERSION" >> $GITHUB_ENV
          echo "abapgen version is: $ABAPGEN_VERSION"
      - name: Upload binaries to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            abap-astgen/abapgen-win.exe
            abap-astgen/abapgen-macos
            abap-astgen/abapgen-macos-arm
            abap-astgen/abapgen-linux
            abap-astgen/abapgen-linux-arm
