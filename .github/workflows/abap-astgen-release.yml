name: ABAP AST Generator Release

on:
  push:
    tags:
      - 'abap-astgen/v*'
  workflow_dispatch:

defaults:
  run:
    working-directory: abap-astgen

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.set-release-tag.outputs.release_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: '0'
      - name: Discover latest tag (manual run)
        if: github.event_name == 'workflow_dispatch'
        run: |
          LATEST_TAG=$(git tag --list 'abap-astgen/v*' --sort=-v:refname | head -n 1)
          echo "RELEASE_TAG=$LATEST_TAG" >> $GITHUB_ENV
          echo "Using latest tag: $LATEST_TAG"
        working-directory: .
      - name: Set tag from push event
        if: github.event_name == 'push'
        run: |
          echo "RELEASE_TAG=${{ github.ref_name }}" >> $GITHUB_ENV
        working-directory: .
      - name: Set release tag output
        id: set-release-tag
        run: echo "release_tag=${{ env.RELEASE_TAG }}" >> $GITHUB_OUTPUT
        working-directory: .
      - name: Verify tag resolved
        run: |
          if [ -z "$RELEASE_TAG" ]; then
            echo "::error::No abap-astgen/v* tag found. Push a tag first, e.g. 'git tag abap-astgen/v0.1.0 && git push origin abap-astgen/v0.1.0'"
            exit 1
          fi
          echo "Releasing tag: $RELEASE_TAG"
        working-directory: .
      - name: Install node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'abap-astgen/package-lock.json'
      - name: Install ldid
        uses: MOZGIII/install-ldid-action@d5ab465f3a66a4d60a59882b935eb30e18e8d043 # v1
        with:
          tag: v2.1.5-procursus6
      - name: Install dependencies
        run: npm install
      - name: Run tests
        run: npm test
      - name: Create binaries
        run: npm run binary
      - name: Rename
        run: |
          mv abapgen-linux-x64 abapgen-linux
          mv abapgen-linux-arm64 abapgen-linux-arm
          mv abapgen-macos-x64 abapgen-macos
          mv abapgen-macos-arm64 abapgen-macos-arm
          mv abapgen-win-x64.exe abapgen-win.exe
      - name: Run gzexe
        run: |
          gzexe abapgen-linux
          rm abapgen-linux~
          gzexe abapgen-linux-arm
          rm abapgen-linux-arm~
      - name: Print size and version
        run: |
          ls -lh ./abapgen*
          ABAPGEN_VERSION=$(node -p "require('./package.json').version")
          echo "ABAPGEN_VERSION=$ABAPGEN_VERSION" >> $GITHUB_ENV
          echo "abapgen version is: $ABAPGEN_VERSION"
      - name: Upload Windows binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: asset-abapgen-win.exe
          path: abap-astgen/abapgen-win.exe
          if-no-files-found: error
      - name: Upload macOS binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: asset-abapgen-macos
          path: abap-astgen/abapgen-macos
          if-no-files-found: error
      - name: Upload macOS ARM binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: asset-abapgen-macos-arm
          path: abap-astgen/abapgen-macos-arm
          if-no-files-found: error
      - name: Upload Linux binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: asset-abapgen-linux
          path: abap-astgen/abapgen-linux
          if-no-files-found: error
      - name: Upload Linux ARM binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: asset-abapgen-linux-arm
          path: abap-astgen/abapgen-linux-arm
          if-no-files-found: error

  checksums:
    needs: build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-artifacts
          pattern: asset-*
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd release-artifacts
          sha256sum * 2>/dev/null | grep -v "Is a directory" > SHA256SUMS || true
          sha512sum * 2>/dev/null | grep -v "Is a directory" > SHA512SUMS || true
          mkdir -p checksums
          mv SHA256SUMS SHA512SUMS checksums/

      - name: Upload checksum files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: asset-checksums
          path: release-artifacts/checksums/

  release:
    needs: [build, checksums]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    concurrency: abap-astgen-release
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-artifacts
          pattern: asset-*
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          draft: true
          tag_name: ${{ needs.build.outputs.release_tag }}
          files: release-artifacts/*
