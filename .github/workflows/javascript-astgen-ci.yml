name: JavaScript AST Generator CI

on:
  workflow_call:  # Called by monorepo-ci.yml
  workflow_dispatch:  # Manual runs for testing

defaults:
  run:
    working-directory: javascript-astgen

jobs:
  javascript-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: '0'
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - name: Install sbt
        uses: sbt/setup-sbt@67d461eba2c4753196c230e02da850757ba4775e # v1.5.14
      - name: Set up JDK
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 21
          cache: sbt
          cache-dependency-path: |
            javascript-astgen/scala-tests/build.sbt
            javascript-astgen/scala-tests/project/build.properties
      - name: Install ldid
        uses: MOZGIII/install-ldid-action@d5ab465f3a66a4d60a59882b935eb30e18e8d043 # v1
        with:
          tag: v2.1.5-procursus7
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Type check
        run: bun check
      - name: Test
        run: bun run test
      - name: Create binaries
        run: bun run binary
      - name: Sign macOS binaries (ad-hoc)
        run: |
          ldid -S astgen-macos-x64
          ldid -S astgen-macos-arm64
      - name: Rename
        run: |
          mv astgen-linux-x64 astgen-linux
          mv astgen-linux-arm64 astgen-linux-arm
          mv astgen-macos-x64 astgen-macos
          mv astgen-macos-arm64 astgen-macos-arm
          mv astgen-win-x64.exe astgen-win.exe
          mv astgen-win-arm64.exe astgen-win-arm.exe
      - name: Print size and version
        run: |
          ls -lh ./astgen*
          ASTGEN_VERSION=$(./astgen-linux --version)
          echo "ASTGEN_VERSION=$ASTGEN_VERSION" >> $GITHUB_ENV
          echo "astgen version is: $ASTGEN_VERSION"
      - name: Generate BabelNodeSyntax.scala
        run: ./astgen-linux --scala-ast-only
      - name: Run Scala Tests
        run: sbt testFull
        working-directory: javascript-astgen/scala-tests
