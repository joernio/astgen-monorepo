name: .NET AST Generator Release

on:
  push:
    tags:
      - 'dotnet-astgen/v*'
  workflow_dispatch:

concurrency: dotnet-astgen-release

permissions:
  contents: write

defaults:
  run:
    working-directory: dotnet-astgen

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.set-release-tag.outputs.release_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: '0'
      - name: Discover latest tag (manual run)
        if: github.event_name == 'workflow_dispatch'
        run: |
          LATEST_TAG=$(git tag --list 'dotnet-astgen/v*' --sort=-v:refname | head -n 1)
          echo "RELEASE_TAG=$LATEST_TAG" >> $GITHUB_ENV
          echo "Using latest tag: $LATEST_TAG"
        working-directory: .
      - name: Set tag from push event
        if: github.event_name == 'push'
        run: |
          echo "RELEASE_TAG=${{ github.ref_name }}" >> $GITHUB_ENV
        working-directory: .
      - name: Set release tag output
        id: set-release-tag
        run: echo "release_tag=${{ env.RELEASE_TAG }}" >> $GITHUB_OUTPUT
        working-directory: .
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'
      - name: Extract version from tag
        run: |
          TAG_VERSION=${RELEASE_TAG#dotnet-astgen/v}
          echo "NEXT_VERSION=$TAG_VERSION" >> $GITHUB_ENV
          echo "The tag version is: $TAG_VERSION"
      - name: Install dependencies
        run: dotnet restore
      - name: Compile
        run: ./build-with-version.sh $NEXT_VERSION
      - name: Build
        run: |
          ./publish-release.sh linux x64
          ./publish-release.sh linux arm64
          ./publish-release.sh osx x64
          ./publish-release.sh win x64
      - name: Rename
        run: |
          mv ./release/linux/DotNetAstGen dotnetastgen-linux
          mv ./release/linux-arm/DotNetAstGen dotnetastgen-linux-arm64
          mv ./release/macos/DotNetAstGen dotnetastgen-macos
          mv ./release/win/DotNetAstGen.exe dotnetastgen-win.exe
      - name: Make executable
        run: |
          chmod +x dotnetastgen-linux-arm64
          chmod +x dotnetastgen-macos
      - name: Upload Linux binary
        uses: actions/upload-artifact@v7
        with:
          name: asset-dotnetastgen-linux
          path: dotnet-astgen/dotnetastgen-linux
          if-no-files-found: error
      - name: Upload Linux ARM64 binary
        uses: actions/upload-artifact@v7
        with:
          name: asset-dotnetastgen-linux-arm64
          path: dotnet-astgen/dotnetastgen-linux-arm64
          if-no-files-found: error
      - name: Upload macOS binary
        uses: actions/upload-artifact@v7
        with:
          name: asset-dotnetastgen-macos
          path: dotnet-astgen/dotnetastgen-macos
          if-no-files-found: error
      - name: Upload Windows binary
        uses: actions/upload-artifact@v7
        with:
          name: asset-dotnetastgen-win.exe
          path: dotnet-astgen/dotnetastgen-win.exe
          if-no-files-found: error

  checksums:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          pattern: asset-*
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd release-artifacts
          mkdir -p checksums
          sha256sum * > checksums/SHA256SUMS
          sha512sum * > checksums/SHA512SUMS

      - name: Upload checksum files
        uses: actions/upload-artifact@v7
        with:
          name: asset-checksums
          path: release-artifacts/checksums/

  release:
    needs: [build, checksums]
    runs-on: ubuntu-latest
    concurrency: dotnet-astgen-release
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          pattern: asset-*
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          tag_name: ${{ needs.build.outputs.release_tag }}
          files: release-artifacts/*
