name: Go AST Generator Release

on:
  push:
    tags:
      - 'go-astgen/v*'
  workflow_dispatch:

concurrency: go-astgen-release

permissions:
  contents: write

defaults:
  run:
    working-directory: go-astgen

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.set-release-tag.outputs.release_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: '0'
      - name: Discover latest tag (manual run)
        if: github.event_name == 'workflow_dispatch'
        run: |
          LATEST_TAG=$(git tag --list 'go-astgen/v*' --sort=-v:refname | head -n 1)
          echo "RELEASE_TAG=$LATEST_TAG" >> $GITHUB_ENV
          echo "Using latest tag: $LATEST_TAG"
        working-directory: .
      - name: Set tag from push event
        if: github.event_name == 'push'
        run: |
          echo "RELEASE_TAG=${{ github.ref_name }}" >> $GITHUB_ENV
        working-directory: .
      - name: Set release tag output
        id: set-release-tag
        run: echo "release_tag=${{ env.RELEASE_TAG }}" >> $GITHUB_OUTPUT
        working-directory: .
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.21.12
      - name: Extract version from tag
        run: |
          TAG_VERSION=${RELEASE_TAG#go-astgen/v}
          echo "TAG_VERSION=$TAG_VERSION" >> $GITHUB_ENV
          echo "The tag version is: v$TAG_VERSION"
      - name: Build
        run: |
          GOOS=linux GOARCH=amd64 go build -o build/goastgen-linux -ldflags "-X main.Version=v${{ env.TAG_VERSION }}"
          GOOS=linux GOARCH=arm64 go build -o build/goastgen-linux-arm64 -ldflags "-X main.Version=v${{ env.TAG_VERSION }}"
          GOOS=windows GOARCH=amd64 go build -o build/goastgen-windows.exe -ldflags "-X main.Version=v${{ env.TAG_VERSION }}"
          GOOS=darwin GOARCH=amd64 go build -o build/goastgen-macos -ldflags "-X main.Version=v${{ env.TAG_VERSION }}"
          GOOS=darwin GOARCH=arm64 go build -o build/goastgen-macos-arm64 -ldflags "-X main.Version=v${{ env.TAG_VERSION }}"
      - name: Upload Linux binary
        uses: actions/upload-artifact@v8
        with:
          name: asset-goastgen-linux
          path: go-astgen/build/goastgen-linux
          if-no-files-found: error
      - name: Upload Linux ARM64 binary
        uses: actions/upload-artifact@v8
        with:
          name: asset-goastgen-linux-arm64
          path: go-astgen/build/goastgen-linux-arm64
          if-no-files-found: error
      - name: Upload Windows binary
        uses: actions/upload-artifact@v8
        with:
          name: asset-goastgen-windows.exe
          path: go-astgen/build/goastgen-windows.exe
          if-no-files-found: error
      - name: Upload macOS binary
        uses: actions/upload-artifact@v8
        with:
          name: asset-goastgen-macos
          path: go-astgen/build/goastgen-macos
          if-no-files-found: error
      - name: Upload macOS ARM64 binary
        uses: actions/upload-artifact@v8
        with:
          name: asset-goastgen-macos-arm64
          path: go-astgen/build/goastgen-macos-arm64
          if-no-files-found: error

  checksums:
    needs: build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v7
        with:
          path: release-artifacts
          pattern: asset-*
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd release-artifacts
          sha256sum * 2>/dev/null | grep -v "Is a directory" > SHA256SUMS || true
          sha512sum * 2>/dev/null | grep -v "Is a directory" > SHA512SUMS || true
          mkdir -p checksums
          mv SHA256SUMS SHA512SUMS checksums/

      - name: Upload checksum files
        uses: actions/upload-artifact@v8
        with:
          name: asset-checksums
          path: release-artifacts/checksums/

  release:
    needs: [build, checksums]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    concurrency: go-astgen-release
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v7
        with:
          path: release-artifacts
          pattern: asset-*
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          tag_name: ${{ needs.build.outputs.release_tag }}
          files: release-artifacts/*
