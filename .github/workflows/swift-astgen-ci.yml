name: Swift AST Generator CI

on:
  workflow_call:  # Called by monorepo-ci.yml
  workflow_dispatch:  # Manual runs for testing

defaults:
  run:
    working-directory: swift-astgen

jobs:
  swift-ci:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: '0'

      - name: Install sbt
        uses: sbt/setup-sbt@ecad189dd245444b9ae0a0cd5922fd938b88906f # v1.5.12

      - name: Install Swift (macos-latest)
        if: matrix.os == 'macos-latest'
        uses: SwiftyLab/setup-swift@d60245579ea3836a3f2fa65ebbe1e8891d577c76 # v1.14.2
        with:
          swift-version: "6.3"

      - name: Install Swift
        if: matrix.os != 'macos-latest'
        uses: SwiftyLab/setup-swift@d60245579ea3836a3f2fa65ebbe1e8891d577c76 # v1.14.2
        with:
          swift-version: "6.1"

      - name: Install swift-format (macos-latest)
        if: matrix.os == 'macos-latest'
        run: command -v swift-format &>/dev/null || brew install swift-format

      - name: Run swift-format lint
        if: matrix.os == 'macos-latest'
        run: |
          swift-format lint --strict --recursive \
            Sources/SwiftAstGen \
            Sources/SwiftAstGenLib \
            Tests/SwiftAstGenTests

      - name: Run Linux Build
        if: matrix.os == 'ubuntu-latest'
        run: |
          swift sdk install https://download.swift.org/swift-6.1-release/static-sdk/swift-6.1-RELEASE/swift-6.1-RELEASE_static-linux-0.0.1.artifactbundle.tar.gz --checksum 111c6f7d280a651208b8c74c0521dd99365d785c1976a6e23162f55f65379ac6
          swift build --swift-sdk x86_64-swift-linux-musl
          mv ./.build/debug/SwiftAstGen SwiftAstGen-linux
          swift build --swift-sdk aarch64-swift-linux-musl
          mv ./.build/debug/SwiftAstGen SwiftAstGen-linux-arm64
          ./SwiftAstGen-linux -s

      - name: Run Mac Build
        if: matrix.os == 'macos-latest'
        run: |
          swift build
          mv ./.build/debug/SwiftAstGen SwiftAstGen-mac
          ./SwiftAstGen-mac -s

      - name: Run Windows Build
        if: matrix.os == 'windows-latest'
        run: |
          swift build
          mv .\.build\debug\SwiftAstGen.exe SwiftAstGen-win.exe
          .\SwiftAstGen-win.exe -s

      - name: Run Swift Tests
        run: swift test

      - name: Set up JDK
        if: matrix.os != 'windows-latest'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
          cache: sbt
          cache-dependency-path: |
            swift-astgen/Tests/ScalaSwiftNodeSyntaxTests/build.sbt
            swift-astgen/Tests/ScalaSwiftNodeSyntaxTests/project/build.properties

      - name: Copy SwiftNodeSyntax.scala to sbt source tree
        shell: bash
        run: cp SwiftNodeSyntax.scala Tests/ScalaSwiftNodeSyntaxTests/src/main/scala/SwiftNodeSyntax.scala

      - name: Run Scala Tests
        run: sbt test
        working-directory: swift-astgen/Tests/ScalaSwiftNodeSyntaxTests
