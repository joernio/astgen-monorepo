[workspace]
members = ["crates/scala_bindings_gen"]
default-members = [".", "crates/scala_bindings_gen"]

[workspace.package]
version = "0.21.1"
edition = "2024"

[workspace.dependencies]
ra_ap_syntax = "0.0.332"

[package]
name = "rust_ast_gen"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.0", features = ["derive"] }
scala_bindings_gen = { path = "crates/scala_bindings_gen" }
dunce = "1.0.5"
env_logger = "0.11.10"
ra_ap_hir = "0.0.332"
ra_ap_ide = "0.0.332"
ra_ap_ide_db = "0.0.332"
ra_ap_load-cargo = "0.0.332"
ra_ap_project_model = "0.0.332"
ra_ap_vfs = "0.0.332"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
log = "0.4.29"
ra_ap_syntax.workspace = true

[dev-dependencies]
# used by the integration tests
temp-dir = "0.1.16"

[profile.release]
lto = "thin"
