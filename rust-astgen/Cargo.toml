[workspace]
members = ["crates/joern_fmt", "crates/rust_analyzer_ext", "crates/rust_ast_function_fullnames", "crates/scala_bindings_gen"]
default-members = [".", "crates/joern_fmt"]

[workspace.package]
version = "0.21.8"
edition = "2024"

[workspace.dependencies]
ra_ap_hir = "0.0.332"
ra_ap_ide_db = "0.0.332"
ra_ap_load-cargo = "0.0.332"
ra_ap_project_model = "0.0.332"
ra_ap_syntax = "0.0.332"
ra_ap_test_fixture = "0.0.332"
ra_ap_vfs = "0.0.332"

[package]
name = "rust_ast_gen"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.0", default-features = false, features = ["std", "help", "usage", "derive"] }
dunce = "1.0.5"
env_logger = { version = "0.11.10", default-features = false }
joern_fmt = { path = "crates/joern_fmt" }
ra_ap_hir.workspace = true
ra_ap_ide_db.workspace = true
ra_ap_load-cargo.workspace = true
ra_ap_project_model.workspace = true
ra_ap_vfs.workspace = true
rust_analyzer_ext = { path = "crates/rust_analyzer_ext" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
log = "0.4.29"
ra_ap_syntax.workspace = true

[dev-dependencies]
# used by the integration tests
temp-dir = "0.1.16"

[profile.release]
lto = "thin"

# compiling rust-analyzer crates just with this opt-level makes debug tests run
# much faster.
[profile.dev.package."*"]
opt-level = 1
